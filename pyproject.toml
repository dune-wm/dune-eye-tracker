[project]
name = "dune-eye-tracker"
version = "0.1.0"
description = "The mouse pointer in dune, moved by where you look (a webcam, MediaPipe)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=1.2.0",
    "numpy>=2.5.4",
    "oneeurofilter>=0.2.1",
    "pygame-ce>=2.5.8",
    "pyvirtualcam>=0.15.0",
    "scipy>=1.14",
]

[project.scripts]
dune-eye-tracker = "dune_eye_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
